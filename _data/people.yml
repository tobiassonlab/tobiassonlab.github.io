# Fields (all optional except name):
#   name   : Full name
#   role   : Short line under the name, e.g. "PhD student (2024–)"
#   years  : Small grey tag after the name, e.g. "2023–"
#   photo  : Path under assets/, e.g. /assets/images/people/jane-doe.jpg
#            (square-ish, ~600 px wide). Leave out to show initials instead.
#   photo_position : Optional crop position of the photo in its square box,
#            "horizontal vertical", e.g. "50% 25%" (lower % = crop higher, showing
#            more of the top). Default is centred, "50% 50%".
#   bio    : Markdown. Use ">" for a multi-line paragraph; blank line = new paragraph.
#   links  : List of {label, url}
#
# Alumni only need: name, note (e.g. "PhD 2022 · now at Uni X").

pi:
  - name: Victor Tobiasson
    role: Principal Investigator
    photo: /assets/images/ppic_victor_tobiasson.JPG
    bio: >
      My academic career has focused on the structural complexity and variation present in evolutionary reductive systems,
      exemplified by the mitochondrial ribosome. 
      
      As a part of my PhD work, I investigated mitoribosomal structures from *T. thermophila* and *P. magna* as well as mitoribosomal
      assembly intermediates from *T. brucei*. This work resulted in my thesis “On the origin and evolution of the mitochondrial ribosome”. 
      
      Following my PhD work, I transitioned from the wet lab to improve my computational skills and to widen the scope of my evolutioanry 
      analysis. I carried out my postdoc in the group of Eugene Koonin at the NCBI/NIH studying the origin of eukaryotes while pursuing further 
      structural studies on the *Toxoplasma gondii* mitochondrial ribosome. 
      
      I have since moved into my own independent position at Glasgow university as a Wellcome Career Development Fellow.

    links:
      - label: Google Scholar
        url: https://scholar.google.com/citations?user=LfaIFD4AAAAJ&hl=en
      - label: ORCID
        url: https://orcid.org/0000-0001-8920-017X
      - label: Email
        url: mailto:Victor.Tobiasson@glasgow.ac.uk

