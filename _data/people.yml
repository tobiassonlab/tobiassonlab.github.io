undergraduates:
  - name: Juanita
    role: Bachelor student
    photo: /assets/images/ppic_juanita_hayes.JPG
    photo_position: "50% 25%"
    bio: >
      I am a 4th-year undergraduate molecular and cellular biology student, carrying out my honors project in Victor Tobiasson's 
      lab. I am investigating 5 different proteins predicted to be mitoribosomal assembly factors, tagging them, and isolating
      them to determine the stage at which these intermediates are involved in assembly.


