# Publications shown on /publications/ (_pages/publications.html).
#
# lab_members : Author names exactly as written in `authors` below; each match
#               is shown in bold. Use the same spelling every time.
# profiles    : Links shown under the page title (list of {label, url}).
# featured    : Optional cover images shown at the top. Leave empty ([]) to hide.
#               image : Path under assets/, e.g. /assets/images/covers/mbe-2025.jpg
#                       (portrait, ~400 px wide)
#               caption, url
#
# articles / chapters / other : one entry per publication. Fields:
#   authors : "Surname, A.B., C.D. Surname, and E. Surname"
#   year    : 2025  (entries are grouped by year, newest first)
#   title   : Paper title (no trailing full stop)
#   journal : Journal or book name (shown in italics)
#   details : Volume, issue and pages, e.g. "42(3): 112–128"   (optional)
#   doi     : Bare DOI, e.g. 10.1093/molbev/msad001           (optional)
#   links   : List of {label, url}, e.g. PDF, Preprint, Code    (optional)
#   note    : Short highlight, e.g. "Cover article"             (optional)
#
# Empty sections are hidden automatically.

lab_members:
  - Tobiasson, V.
  - V. Tobiasson

profiles:
  - label: Google Scholar
    url: https://scholar.google.com/
  - label: ORCID
    url: https://orcid.org/

featured: []
