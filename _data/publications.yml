# Settings for /publications/ (_pages/publications.html).
#
# The publication list itself comes from assets/publications.bib (rendered by
# BibBase) — add papers there, not here.
#
# profiles : Links shown under the page title (list of {label, url}).
# featured : Optional cover images shown above the list. Leave empty ([]) to hide.
#            image   : Path under assets/, e.g. /assets/images/covers/nature-2026.jpg
#                      (portrait, ~400 px wide)
#            caption, url

profiles:
  - label: Google Scholar
    url: https://scholar.google.com/
  - label: ORCID
    url: https://orcid.org/0000-0001-8920-017X

featured: []
